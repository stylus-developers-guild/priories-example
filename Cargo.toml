[package]
name = "priories"
version = "0.1.0"
edition = "2024"

[lib]
name = "libpriories"

[dependencies]
base64 = { version = "0.22.1", default-features = false }
paste = "1.0.15"
rand = { version = "0.9.2", default-features = false }
rand_chacha = { version = "0.9.0", default-features = false }
stylus-sdk = { version = "0.10.0-beta.1" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
stylus-sdk = { version = "0.10.0-beta.1", features = ["stylus-test"] }
tiny-keccak = "2.0.2"
alloy-primitives = { version = "0.8.20", default-features = false, features = ["tiny-keccak"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
alloy-primitives = { version = "0.8.20", default-features = false, features = ["native-keccak"] }

[patch.crates-io]
stylus-sdk = { git = "https://github.com/OffchainLabs/stylus-sdk-rs" }
stylus-core = { git = "https://github.com/OffchainLabs/stylus-sdk-rs" }
stylus-proc = { git = "https://github.com/OffchainLabs/stylus-sdk-rs" }
